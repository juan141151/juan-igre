<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje igre</title>
<style>
  :root{
    --bg: #1b1712;
    --bg2: #241e17;
    --card: #2a231b;
    --wood: #e2823c;
    --wood-dark: #a85a24;
    --ink: #f3ece2;
    --ink-dim: #b7a999;
    --ok: #5fae82;
    --border: #3a3025;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
  }
  .wrap{max-width: 720px; margin: 0 auto; padding: 48px 20px 60px;}
  h1{
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 2.3rem;
    margin: 0 0 8px;
  }
  h1 span{color: var(--wood);}
  .tagline{color: var(--ink-dim); font-size: 1rem; margin: 0 0 36px;}

  .grid{ display:grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 560px){ .grid{ grid-template-columns: 1fr 1fr; } }

  .game-card{
    display:block;
    text-decoration:none;
    color: inherit;
    background: linear-gradient(180deg, var(--card), #221c15);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .game-card:hover{ transform: translateY(-3px); border-color: var(--wood); }
  .game-icon{ font-size: 2.2rem; margin-bottom: 10px; display:block; }
  .game-title{ font-size: 1.2rem; font-weight: 700; margin: 0 0 6px; }
  .game-desc{ color: var(--ink-dim); font-size: 0.88rem; line-height: 1.5; margin: 0 0 14px; }
  .game-play{ color: var(--wood); font-weight: 700; font-size: 0.88rem; }

  /* Placeholder card for games not yet added */
  .game-card.soon{
    opacity: 0.45;
    cursor: default;
  }
  .game-card.soon:hover{ transform:none; border-color: var(--border); }

  footer{ text-align:center; color: var(--ink-dim); font-size:0.78rem; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Moje <span>igre</span></h1>
  <p class="tagline">Zbirka domačih igric — izberi eno in igraj.</p>

  <div class="grid">

    <!-- ============================================================
         VSAKA IGRA JE EN "game-card" BLOK. Za novo igro:
         1. Skopiraj cel <a class="game-card" ...> ... </a> blok spodaj.
         2. Zamenjaj href, emoji, naslov in opis.
         3. Ustvari novo podmapo v games/ s svojo index.html/vzigalice.html in .apk.
         ============================================================ -->

    <a class="game-card" href="games/vzigalice.html">
      <span class="game-icon">🔥</span>
      <div class="game-title">Vžigalice</div>
      <div class="game-desc">Premakni eno (ali več) vžigalico in popravi matematično enačbo.</div>
      <div class="game-play">Igraj →</div>
    </a>

    <!-- primer prazne kartice za naslednjo igro — zbriši ta komentar in blok spodaj, ko dodaš pravo igro -->
    <div class="game-card soon">
      <span class="game-icon">➕</span>
      <div class="game-title">Naslednja igra</div>
      <div class="game-desc">Kmalu na voljo.</div>
    </div>

  </div>

  <footer>Narejeno kot domač projekt. 🔥</footer>
</div>
</body>
</html>
